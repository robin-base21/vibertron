# Behind Pangolin on the same host, when Pangolin's targets are container names:
#   docker compose -f docker-compose.yml -f docker-compose.pangolin.yml up -d --build
#
# Adds the containers to Pangolin's Docker network, so Pangolin's Traefik reaches them by name
# (vibertron-frontend:3000, vibertron-backend:3001, vibertron-site:3100). Host ports stay as set in
# .env, so targets by IP and port keep working too. Check the network's name with
# `docker network ls` (the Pangolin installer calls it "pangolin"); set PANGOLIN_NETWORK if it differs.

services:
  backend:
    networks:
      - vibertron-network
      - pangolin

  frontend:
    networks:
      - vibertron-network
      - pangolin

  site:
    networks:
      - vibertron-network
      - pangolin

networks:
  pangolin:
    external: true
    name: ${PANGOLIN_NETWORK:-pangolin}
