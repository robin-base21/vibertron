services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: vibertron-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/vibertron.sqlite
      - UPLOAD_DIR=/data/uploads
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-pro}
      - MESSAGE_RATE_LIMIT_MS=${MESSAGE_RATE_LIMIT_MS:-5000}
      # "Publish to site": where to push results, and the secret shared with the site.
      - SITE_PUBLISH_URL=${SITE_PUBLISH_URL:-http://site:3100/api/results}
      - SITE_PUBLISH_SECRET=${SITE_PUBLISH_SECRET:-}
    volumes:
      - vibertron-data:/data
    restart: unless-stopped
    networks:
      - vibertron-network

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: vibertron-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Empty = same origin as the page: put a reverse proxy in front that sends /api and /ws to
      # the backend and everything else to the frontend. Set both only for a separate API host.
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
      - PUBLIC_WS_URL=${PUBLIC_WS_URL:-}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vibertron-network

  site:
    build:
      context: .
      dockerfile: packages/site/Dockerfile
    container_name: vibertron-site
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      # Public URL of the site: SvelteKit's CSRF check behind the proxy, and every link in emails.
      - ORIGIN=${SITE_ORIGIN:-https://vibe.ourbusan.life}
      - SITE_ADMIN_PASSWORD=${SITE_ADMIN_PASSWORD:-}
      - SITE_PUBLISH_SECRET=${SITE_PUBLISH_SECRET:-}
      - PUBLIC_SITE_TIMEZONE=${PUBLIC_SITE_TIMEZONE:-Asia/Seoul}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SITE_MAIL_FROM=${SITE_MAIL_FROM:-OurBusan.vibe <hello@mail.base21.space>}
      - SITE_MAIL_REPLY_TO=${SITE_MAIL_REPLY_TO:-}
      - SITE_ADMIN_EMAIL=${SITE_ADMIN_EMAIL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - SITE_AI_PROVIDER=${SITE_AI_PROVIDER:-}
      - PPQ_API_KEY=${PPQ_API_KEY:-}
      - SITE_AI_TEXT_MODEL=${SITE_AI_TEXT_MODEL:-}
      - SITE_AI_IMAGE_MODEL=${SITE_AI_IMAGE_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - SITE_AI_TEXT_MODEL=${SITE_AI_TEXT_MODEL:-anthropic/claude-sonnet-5.5}
      - SITE_AI_IMAGE_MODEL=${SITE_AI_IMAGE_MODEL:-google/gemini-3-pro-image}
      # Served over HTTPS: admin and signup cookies are Secure (false only for a local http test).
      - COOKIE_SECURE=${SITE_COOKIE_SECURE:-true}
    volumes:
      - vibertron-site-data:/data
    restart: unless-stopped
    networks:
      - vibertron-network

volumes:
  vibertron-data:
  vibertron-site-data:

networks:
  vibertron-network:
    driver: bridge
